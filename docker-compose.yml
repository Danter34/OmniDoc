services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnidoc_db}
      POSTGRES_USER: ${POSTGRES_USER:-omnidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - omnidoc-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - omnidoc-internal

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "127.0.0.1:1025:1025"
    expose:
      - "1025"
    networks:
      - omnidoc-internal

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    cpus: '1.5'
    mem_limit: 1536m
    environment:
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
      CHROMIUM_DENY_LIST: '^https?://.*'
      LIBREOFFICE_DENY_LIST: '^https?://.*'
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - omnidoc-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-omnidoc_db};Username=${POSTGRES_USER:-omnidoc};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ConnectionStrings__RedisConnection: redis:6379
      FileStorage__RootPath: /app/data/documents
      Gotenberg__BaseUrl: ${GOTENBERG_BASE_URL:-http://gotenberg:3000}
      Frontend__BaseUrl: ${APP_URL:-http://localhost}
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JwtSettings__Issuer: ${JWT_ISSUER:-OmniDocApi}
      JwtSettings__Audience: ${JWT_AUDIENCE:-OmniDocClient}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      AiSettings__Provider: ${AI_PROVIDER:-Gemini}
      AiSettings__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      AiSettings__Gemini__ChatModel: ${GEMINI_CHAT_MODEL:-gemini-3.6-flash}
      AiSettings__Gemini__EmbeddingModel: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      EmailSettings__Host: ${SMTP_HOST:-mailpit}
      EmailSettings__Port: ${SMTP_PORT:-1025}
      EmailSettings__Username: ${SMTP_USERNAME:-}
      EmailSettings__Password: ${SMTP_PASSWORD:-}
      EmailSettings__FromEmail: ${SMTP_FROM_EMAIL:-no-reply@example.com}
      EmailSettings__FromName: ${SMTP_FROM_NAME:-OmniDoc}
      EmailSettings__EnableSsl: ${SMTP_ENABLE_SSL:-false}
      EmailSettings__ShowDemoOtp: ${EMAIL_SHOW_DEMO_OTP:-false}
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - documents:/app/data/documents
    networks:
      - omnidoc-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        OMNIDOC_API_URL: http://backend:8080
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      OMNIDOC_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"
    networks:
      - omnidoc-internal

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Reserved for TLS termination once certificates are mounted.
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - omnidoc-internal

volumes:
  pgdata:
  redisdata:
  documents:

networks:
  omnidoc-internal:
    driver: bridge
